# Once a day, publish whatever changed in the artist's latest release to the review site.
# Most days it finds nothing and ends in about a minute. Run it now from the Actions tab: "Run workflow".
# Every setting is a repository secret, not a variable, because GitHub hides secret values in the public logs:
#   DELIVERY_REPO          the artist's private repo, owner/name
#   DELIVERY_REPO_TOKEN    a token that can read that repo's releases
#   R2_BUCKET              the site's R2 bucket
#   CLOUDFLARE_ACCOUNT_ID  the account that holds it
#   CLOUDFLARE_API_TOKEN   a token with R2 edit on that account
#   SITE_FIELDS_PY         optional: the contents of the project's tools/site_fields.py
name: Pull the artist's art
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what changed"
        type: boolean
        default: false
      corrections:
        description: "Overlay the configured correction delivery"
        type: boolean
        default: false
      options:
        description: "Publish the configured art options for review"
        type: boolean
        default: false
      finalize_options:
        description: "Publish reviewed art choices as the default artwork"
        type: boolean
        default: false
concurrency:
  group: pull-art
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  pull:
    runs-on: ubuntu-latest
    # ponytail: a full re-render of tens of thousands of files does not fit in one run's time. The tool works one
    # ZIP at a time, so disk holds about one ZIP, and it saves progress after each ZIP. The next daily run
    # continues, so a full re-render finishes over a few days. A run overwrites nothing until its last write
    # switches the site, so a local run and this job can overlap: the site shows whichever release switched last.
    timeout-minutes: 300
    steps:
      - name: Check delivery mode
        if: ${{ (inputs.corrections && (inputs.options || inputs.finalize_options)) || (inputs.options && inputs.finalize_options) }}
        run: |
          echo "Select one delivery mode."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pillow==12.3.0 && npm install --global wrangler@4.101.0
      - name: Add the project's site fields
        env:
          SITE_FIELDS_PY: ${{ secrets.SITE_FIELDS_PY }}
        run: if [ -n "$SITE_FIELDS_PY" ]; then printf '%s\n' "$SITE_FIELDS_PY" > tools/site_fields.py; fi
      - name: Publish changes
        if: ${{ !inputs.corrections && !inputs.options && !inputs.finalize_options }}
        env:
          GH_TOKEN: ${{ secrets.DELIVERY_REPO_TOKEN }}
          DELIVERY_REPO: ${{ secrets.DELIVERY_REPO }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 -I tools/pull_update.py ${{ inputs.dry_run && ' ' || '--apply' }}
      - name: Publish corrections
        if: ${{ inputs.corrections }}
        env:
          GH_TOKEN: ${{ secrets.CORRECTION_REPO_TOKEN || secrets.DELIVERY_REPO_TOKEN }}
          CORRECTION_DELIVERY: ${{ secrets.CORRECTION_DELIVERY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          repo=$(jq -er '.repo | strings | select(length > 0)' <<< "$CORRECTION_DELIVERY")
          tag=$(jq -er '.tag | strings | select(length > 0)' <<< "$CORRECTION_DELIVERY")
          archive=$(jq -er '.archive | strings | select(length > 0)' <<< "$CORRECTION_DELIVERY")
          baseline=$(jq -er '.baseline | strings | select(length > 0)' <<< "$CORRECTION_DELIVERY")
          count=$(jq -er '.count | numbers' <<< "$CORRECTION_DELIVERY")
          final_index=$(jq -er '.final_index // "" | strings' <<< "$CORRECTION_DELIVERY")
          extra=()
          if [[ -n "$final_index" ]]; then
            FINAL_SELECTIONS=$(jq -ce '.final_choices | objects' <<< "$CORRECTION_DELIVERY")
            export FINAL_SELECTIONS
            extra=(--final-index "$final_index")
          fi
          python3 -I tools/pull_update.py --repo="$repo" --corrections="$archive" \
            --base-tag="$baseline" --expected-ids="$count" "${extra[@]}" ${{ inputs.dry_run && ' ' || '--apply' }} -- "$tag"
      - name: Publish options
        if: ${{ inputs.options || inputs.finalize_options }}
        env:
          GH_TOKEN: ${{ secrets.OPTION_REPO_TOKEN || secrets.DELIVERY_REPO_TOKEN }}
          OPTION_DELIVERY: ${{ secrets.OPTION_DELIVERY }}
          OPTION_SELECTIONS: ${{ secrets.OPTION_SELECTIONS }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          repo=$(jq -er '.repo | strings | select(length > 0)' <<< "$OPTION_DELIVERY")
          tag=$(jq -er '.tag | strings | select(length > 0)' <<< "$OPTION_DELIVERY")
          archive=$(jq -er '.archive | strings | select(length > 0)' <<< "$OPTION_DELIVERY")
          index=$(jq -er '.index | strings | select(length > 0)' <<< "$OPTION_DELIVERY")
          ids=$(jq -er '.ids | numbers' <<< "$OPTION_DELIVERY")
          options=$(jq -er '.options | numbers' <<< "$OPTION_DELIVERY")
          python3 -I tools/pull_update.py --repo="$repo" --options="$archive" --option-index="$index" \
            --expected-ids="$ids" --expected-options="$options" ${{ inputs.finalize_options && '--finalize-options' || ' ' }} \
            ${{ inputs.dry_run && ' ' || '--apply' }} -- "$tag"
